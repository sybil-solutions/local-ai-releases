# Downloads a release's files the way a person would and runs them on real machines: the Windows installer, the Mac
# app and the one-line Linux installer. Each is checked against the release's checksums, installed, started, and its
# server asked what it sees. The app's publish script runs this on a new version before it becomes the newest
# release. By hand: gh workflow run check.yml -f tag=v0.7.11
name: Check a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to check, such as v0.7.11
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag }}
jobs:
  windows:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the installer and check it against the release's checksum
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[\w.]+)?$') { throw "Not a release tag: $env:TAG" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          curl.exe -fsSL --retry 3 -o Local-AI-windows-x64.exe "$base/Local-AI-windows-x64.exe"
          curl.exe -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          $want = ((Get-Content SHA256SUMS) -match ' Local-AI-windows-x64\.exe$')[0].Split(' ')[0]
          $got = (Get-FileHash Local-AI-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "The installer's checksum is $got; the release says $want" }
      # These machines have no GPU. The app reads its GPUs from nvidia-smi, so one that answers like a 24 GB card
      # stands in: what is checked is that the app on Windows finds the card and lists the models tested for it.
      - name: A stand-in nvidia-smi
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory stand-in | Out-Null
          @'
          using System; using System.Threading;
          class P { static void Main(string[] a) { bool loop = Array.IndexOf(a, "-l") >= 0;
            do { Console.WriteLine("0, NVIDIA GeForce RTX 3090, 24576, 512, 0, 30.00, 40"); Console.Out.Flush(); if (loop) Thread.Sleep(2000); } while (loop); } }
          '@ | Set-Content stand-in\smi.cs
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:stand-in\nvidia-smi.exe stand-in\smi.cs
          & .\stand-in\nvidia-smi.exe
      - name: Install it
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process -FilePath .\Local-AI-windows-x64.exe -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw 'The installer did not finish in five minutes' }
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Local AI.exe' | Select-Object -First 1
          if (-not $app) { throw 'The installer left no Local AI.exe' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Local AI.lnk")) { throw 'The installer added no Start menu entry' }
          "APP=$($app.FullName)" >> $env:GITHUB_ENV
          "Installed at $($app.FullName)"
      - name: Start it and ask its server what it sees
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v' -replace '-.*$'
          $env:PATH = "$PWD\stand-in;$env:PATH"
          Start-Process -FilePath $env:APP
          $health = $null
          foreach ($i in 1..90) { try { $health = Invoke-RestMethod http://127.0.0.1:18700/api/health -TimeoutSec 2; break } catch { Start-Sleep 1 } }
          if ($health.app -ne 'local-ai') { throw 'The app did not start its server' }
          $key = (Get-Content "$env:USERPROFILE\.local-ai\config.json" -Raw | ConvertFrom-Json).key
          $state = $null
          foreach ($i in 1..90) {
            $state = Invoke-RestMethod 'http://127.0.0.1:18700/api/state?v=-1' -Headers @{ authorization = "Bearer $key" } -TimeoutSec 40
            if ($state.catalog.count -gt 0 -and @($state.gpus).Count -gt 0 -and @($state.groups).Count -gt 0) { break }
            Start-Sleep 1
          }
          $recipes = @($state.groups[0].recipes).Count
          "Local AI $($state.app.version) on $($state.os): $(@($state.gpus).Count) GPU ($($state.gpus[0].name), $($state.gpus[0].total) MiB), $recipes models offered of $($state.catalog.count) recipes; Docker: $($state.docker | ConvertTo-Json -Compress)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($state.app.version -ne $version) { throw "It says it is version $($state.app.version), not $version" }
          if ($state.os -ne 'win32') { throw "It says it runs on $($state.os)" }
          if ($state.gpus[0].name -ne 'NVIDIA GeForce RTX 3090' -or $state.gpus[0].total -ne 24576) { throw 'It did not read the GPU from nvidia-smi' }
          if ($recipes -lt 1) { throw 'It offered no model for the card' }
          $page = Invoke-WebRequest http://127.0.0.1:18700/ -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<title>Local AI</title>') { throw 'Its page was not served' }
          if ((Invoke-WebRequest http://127.0.0.1:18700/api/state -SkipHttpErrorCheck -UseBasicParsing).StatusCode -ne 401) { throw 'Its API answered without the key' }
          foreach ($i in 1..30) { $window = Get-Process 'Local AI' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }; if ($window) { break }; Start-Sleep 1 }
          if (-not $window) { throw 'It opened no window' }
          Start-Sleep 3
          try { # a picture of the screen, kept with the run; a machine that can't take one has still passed
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Left, $screen.Top, 0, 0, $shot.Size)
            $shot.Save("$PWD\windows.png")
          } catch { "No picture of the screen: $_" }
      - name: Quit and uninstall it
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process 'Local AI' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $remove = Start-Process -FilePath (Join-Path (Split-Path $env:APP) 'Uninstall Local AI.exe') -ArgumentList '/S' -PassThru
          $remove.WaitForExit(120000) | Out-Null
          foreach ($i in 1..60) { if (-not (Test-Path $env:APP)) { break }; Start-Sleep 1 }
          if (Test-Path $env:APP) { throw 'The uninstaller left the app behind' }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Local AI.lnk") { throw 'The uninstaller left the Start menu entry behind' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows
          path: windows.png
          if-no-files-found: ignore
  mac:
    name: Mac app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download the app and check it against the release's checksum
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL --retry 3 -O "$base/Local-AI-mac-arm64.dmg" -O "$base/SHA256SUMS"
          grep ' Local-AI-mac-arm64.dmg$' SHA256SUMS | shasum -a 256 -c -
      - name: Apple notarized it, and its signature is whole
        run: |
          set -euo pipefail
          xcrun stapler validate Local-AI-mac-arm64.dmg
          spctl --assess --type open --context context:primary-signature --verbose Local-AI-mac-arm64.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/dmg" Local-AI-mac-arm64.dmg >/dev/null
          ditto "dmg/Local AI.app" "/Applications/Local AI.app"
          hdiutil detach "$PWD/dmg" >/dev/null
          codesign --verify --deep --strict "/Applications/Local AI.app"
          spctl --assess --type execute --verbose "/Applications/Local AI.app"
          xcrun stapler validate "/Applications/Local AI.app"
      - name: Start it and ask its server what it sees
        run: |
          set -euo pipefail
          open -a "/Applications/Local AI.app"
          for _ in $(seq 1 90); do curl -fs -m 2 http://127.0.0.1:18700/api/health | grep -q '"app":"local-ai"' && break; sleep 1; done
          curl -fs -m 2 http://127.0.0.1:18700/api/health | grep -q '"app":"local-ai"' || { echo "The app did not start its server"; exit 1; }
          key="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.local-ai/config.json")))["key"])')"
          curl -fs -m 40 -H "authorization: Bearer $key" 'http://127.0.0.1:18700/api/state?v=-1' > state.json
          python3 - "${TAG#v}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          s, version = json.load(open('state.json')), sys.argv[1].split('-')[0]
          print(f"Local AI {s['app']['version']} on {s['os']}: {len(s['gpus'])} GPU ({', '.join(g['name'] for g in s['gpus'])})")
          assert s['app']['version'] == version, f"It says it is version {s['app']['version']}, not {version}"
          assert s['os'] == 'darwin', f"It says it runs on {s['os']}"
          PY
          curl -fs -m 10 http://127.0.0.1:18700/ | grep -q '<title>Local AI</title>' || { echo "Its page was not served"; exit 1; }
          [ "$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18700/api/state)" = 401 ] || { echo "Its API answered without the key"; exit 1; }
          sleep 3
          screencapture -x mac.png || true
          osascript -e 'quit app "Local AI"' || pkill -x "Local AI" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac
          path: mac.png
          if-no-files-found: ignore
  linux:
    name: Linux installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: A user session for the service to live in, and a desktop's xdg-open
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          if ! command -v xdg-open >/dev/null || ! command -v desktop-file-validate >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends xdg-utils desktop-file-utils >/dev/null; fi
      - name: Download the one-line installer and check it against the release's checksum
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL --retry 3 -O "$base/install.sh" -O "$base/SHA256SUMS"
          grep ' install.sh$' SHA256SUMS | sha256sum -c -
          echo "LOCAL_AI_RELEASE=$base" >> "$GITHUB_ENV"
      - name: Install it, and ask its server what it sees
        run: |
          set -euo pipefail
          bash install.sh # what the website's line runs, taking this release's files
          systemctl --user is-active local-ai.service
          key="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.local-ai/config.json")))["key"])')"
          curl -fs -m 40 -H "authorization: Bearer $key" 'http://127.0.0.1:18700/api/state?v=-1' > state.json
          python3 - "${TAG#v}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          s, version = json.load(open('state.json')), sys.argv[1].split('-')[0]
          print(f"Local AI {s['app']['version']} on {s['os']}: {len(s['gpus'])} GPU; Docker: {json.dumps(s['docker'])}")
          assert s['app']['version'] == version, f"It says it is version {s['app']['version']}, not {version}"
          assert s['os'] == 'linux', f"It says it runs on {s['os']}"
          PY
          curl -fs -m 10 http://127.0.0.1:18700/ | grep -q '<title>Local AI</title>' || { echo "Its page was not served"; exit 1; }
          [ "$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18700/api/state)" = 401 ] || { echo "Its API answered without the key"; exit 1; }
          entry="$HOME/.local/share/applications/local-ai.desktop"
          desktop-file-validate "$entry"
          [ "$(stat -c %a "$entry")" = 600 ] || { echo "The app-menu entry holds the key and others can read it"; exit 1; }
          grep -q "^Exec=xdg-open \"http://127.0.0.1:18700/#key=$key\"$" "$entry" || { echo "The app-menu entry does not open the page with the key"; exit 1; }
      - name: Run again, it updates and keeps the key
        run: |
          set -euo pipefail
          before="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.local-ai/config.json")))["key"])')"
          bash install.sh
          after="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.local-ai/config.json")))["key"])')"
          [ "$before" = "$after" ] || { echo "The key changed on an update"; exit 1; }
          systemctl --user is-active local-ai.service
          curl -fs -m 5 http://127.0.0.1:18700/api/health | grep -q '"app":"local-ai"'
